name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當 main 分支有更新時自動部署

permissions:
  contents: write # 允許 Actions 寫入倉庫的分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 直接發佈根目錄的靜態網頁檔案
